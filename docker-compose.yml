version: '3.8'

services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - backend-network
    volumes:
      - mongodb-data:/data/db

  redis-main:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis-main-data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - backend-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gc25
      - REDIS_URL=redis://redis-main:6379/0
      - FRONTEND_ORIGIN=http://localhost:3000
    env_file:
      - .env
    depends_on:
      redis-main:
        condition: service_healthy
      mongodb:
        condition: service_started

  celery_worker:
    build: ./backend
    command: ["celery", "-A", "celery_app.app", "worker", "--loglevel=info"]
    networks:
      - backend-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gc25
      - REDIS_URL=redis://redis-main:6379/0
    env_file:
      - .env
    depends_on:
      redis-main:
        condition: service_healthy
      mongodb:
        condition: service_started
      backend:
        condition: service_started

  celery_beat:
    build: ./backend
    command: ["celery", "-A", "celery_app.app", "beat", "--loglevel=info"]
    networks:
      - backend-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gc25
      - REDIS_URL=redis://redis-main:6379/0
    env_file:
      - .env
    depends_on:
      redis-main:
        condition: service_healthy
      mongodb:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build: 
      context: ./opensoft
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - backend-network
    depends_on:
      - backend

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-main-data:
